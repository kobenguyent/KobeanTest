[package]
name = "kobean-desktop"
version = "0.1.0"
description = "KobeanTest - 100% Localhost Test Management Desktop Application"
authors = ["Kobean Engineering Team"]
edition = "2021"

[lib]
name = "kobean_core"
path = "src/lib.rs"

[[bin]]
name = "kobean-desktop"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.10"
