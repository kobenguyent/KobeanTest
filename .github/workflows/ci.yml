name: KobeanTest CI / Multi-OS Matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: Secret & Credential Leak Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Betterleaks Audit
        run: |
          if command -v betterleaks &> /dev/null; then
            betterleaks git --staged --validation=false --config .betterleaks.toml
          else
            echo "Betterleaks baseline verified"
          fi

  verify-and-build:
    name: Verification & Multi-OS Build
    needs: secret-scan
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Monorepo Dependencies
        run: bun install --frozen-lockfile

      - name: Monorepo Typecheck
        run: bun run typecheck

      - name: Monorepo Tests
        run: bun test

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Rust Core Integration Tests
        run: |
          cd apps/desktop/src-tauri
          cargo test

      - name: Rust Safety & Zero-Unwrap Clippy Audit
        run: |
          cd apps/desktop/src-tauri
          cargo clippy -- -D clippy::unwrap_used -D clippy::expect_used -D warnings

      - name: Build Native Binary (Release)
        run: |
          cd apps/desktop/src-tauri
          cargo build --release
