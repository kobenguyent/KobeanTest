pre-commit:
  parallel: true
  commands:
    betterleaks:
      run: betterleaks git --staged --validation=false --config .betterleaks.toml
      tags: security
    typecheck:
      run: bun run typecheck
      tags: quality

commit-msg:
  commands:
    conventional-commit:
      run: bunx --yes commitlint --edit {1}
